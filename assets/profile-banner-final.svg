<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Ankit Ghoghari — Data Scientist</title>
<desc id="desc">Professional GitHub profile banner with a sharp local portrait, data science toolkit, workflow and opportunity focus.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050B16"/><stop offset=".58" stop-color="#081221"/><stop offset="1" stop-color="#140A26"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#10B981"/></linearGradient>
